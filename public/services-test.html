
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FDFBF7">

  <title>Services — Legit Creations Ltd</title>
  <meta
    name="description"
    content="Digital product engineering and development services by Legit Creations Ltd."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: light;

      --bone: #FDFBF7;
      --obsidian: #2A1006;
      --gold: #946C00;
      --ash: #575757;

      --font-display: "Playfair Display", Georgia, serif;

      --font-body: "Inter", sans-serif;

      --content-width: 1600px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--bone);
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--bone);
      color: var(--obsidian);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .services-page {
      width: 100%;
      overflow: hidden;
      background: white;
      padding: 50px 0;
    }

    .services-intro {
      width: 100%;
      max-width: var(--content-width);
      margin-inline: auto;
      padding: 0 24px;
     
    }

    /* HEADER LAYOUT */

    .intro-grid {
      display: grid;
      grid-tem: ;plate-columns: 1fr;
      gap: 32px;
    }

    .intro-heading {
      min-width: 0;
    }

    /* SECTION LABEL */

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .eyebrow-icon {
      display: block;
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: var(--gold);
    }

    .eyebrow-label {
      margin: 0;
      color: var(--ash);
      font-size: 9px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: 0.45em;
      text-transform: uppercase;
    }

    /* DISPLAY HEADING */

    .services-heading {
      margin: 0;
      color: var(--obsidian);
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 400;
      line-height: 1.05;
     letter-spacing: -0.025em;
    }

    .services-heading strong {
      display: block;
      font-weight:700;
      font-size: 36px;
      text-transform: uppercase;
    }

    /* DESCRIPTION */

    .intro-copy {
      max-width: 100%;
      margin: 0;
      color: var(--ash);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 25px;
      letter-spacing: 0.025em;
    }

    /* SECTION DIVIDER */

    .intro-divider {
      width: 90%;
      height: 1px;
      border: 0;
      background:#471F0E69;
      margin: 32px auto;
    }
    img{
      width:100%;
      height:auto;
    }
    /* SMALL MOBILE */

    @media (max-width: 374px) {
      .services-intro {
        padding-inline: 20px;
      }

      .services-heading {
        font-size: 30px;
      }

      .intro-copy {
        font-size: 14px;
        line-height: 27px;
      }
    }

    /* TABLET */

    @media (min-width: 640px) {
      .services-intro {
        padding: 112px 32px;
      }

      .services-heading {
        font-size: 48px;
      }

      .intro-copy {
        max-width: 620px;
        font-size: 16px;
        line-height: 32px;
      }
    }

    /* DESKTOP — REPOSITORY GRID */

    @media (min-width: 1024px) {
      .services-intro {
        padding: 160px 48px;
      }

      .intro-grid {
        grid-template-columns: minmax(0, 1fr) 360px;
        align-items: end;
        gap: 48px;
      }

      .eyebrow {
        margin-bottom: 32px;
      }

      .services-heading {
        font-size: 60px;
      }

      .intro-copy {
        max-width: 360px;
        padding-bottom: 8px;
        font-size: 14px;
        line-height: 28px;
      }


    }

    @media (min-width: 1280px) {
      .services-heading {
        font-size: 64px;
      }

      .intro-copy {
        font-size: 16px;
        line-height: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <main class="services-page">

    <section
      class="services-intro"
      aria-labelledby="services-heading"
    >
      <div class="intro-grid">

        <div class="intro-heading">

          <div class="eyebrow">

            <!-- Lucide Camera icon -->
            <svg
              class="eyebrow-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5L14.5 4Z"/>
              <circle cx="12" cy="13" r="3"/>
            </svg>

            <p class="eyebrow-label">
              Services
            </p>

          </div>

          <h2
            id="services-heading"
            class="services-heading"
          >
            LGC is Built for the Hard
            <strong>Middle Part.</strong>
          </h2>

        </div>

        <div class="intro-description">

          <p class="intro-copy">
            With a senior team of few, but no juniors in your account.<br>
            We program and develop digital products that solve real
            business problems — from business websites to complex
            web and commercial applications.
          </p>

        </div>

      </div>
    </section>
    <hr class="intro-divider">
    <img srcset="" src="https://6a8vioqz79gk6zhf.public.blob.vercel-storage.com/Digital-Integration-service.jpeg" alt=""> 
  </main>
</body>
</html>
